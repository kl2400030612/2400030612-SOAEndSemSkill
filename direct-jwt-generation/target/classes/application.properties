# ---------- Server ----------
server.port=8080
spring.application.name=direct-jwt-generation

# ---------- JWT ----------
# The secret is read from the environment variable JWT_SECRET.
# If JWT_SECRET is not set, the value after the colon is used (LOCAL LEARNING USE ONLY).
# HS256 needs at least 32 characters (256 bits). The app refuses to start if it is shorter.
jwt.secret=${JWT_SECRET:local-dev-only-secret-change-me-0123456789-abcdef}

# How long a generated token stays valid (in minutes)
jwt.expiration-minutes=60

# ---------- Swagger UI / OpenAPI ----------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
